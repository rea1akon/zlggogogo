# ============================================================
# Cloudflare Workers + D1 统一配置
# 文档: https://developers.cloudflare.com/workers/wrangler/configuration/
# ============================================================

name = "zlg-maintenance-api"
main = "worker/src/index.js"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# 本地开发监听端口（wrangler dev）
[dev]
port = 8787
ip = "127.0.0.1"

# 线上日志（免费额度内可用）
[observability]
enabled = true
head_sampling_rate = 1

# ------------------------------------------------------------
# D1 数据库绑定：Worker 内通过 env.DB 访问
# database_id 本地开发可用占位符；上线前请用真实 ID 替换（见 README）
# 获取方式: npx wrangler d1 create zlg_maintenance_db
# ------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "zlg_maintenance_db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

# ------------------------------------------------------------
# 非敏感环境变量（明文，会进 Git）
# 敏感值一律放 .dev.vars / wrangler secret put，不要写在这里
# ------------------------------------------------------------
[vars]
ENVIRONMENT = "development"
API_TITLE = "庄骆贵一体化养护管理系统 API"
API_VERSION = "v1"
# 允许跨域调用的前端来源，逗号分隔；上线后填 Pages 域名
ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"
# 列表接口默认分页
DEFAULT_PAGE_SIZE = "20"
MAX_PAGE_SIZE = "200"

# ------------------------------------------------------------
# 生产环境覆盖（部署加 --env production）
# ------------------------------------------------------------
[env.production]
name = "zlg-maintenance-api"

[[env.production.d1_databases]]
binding = "DB"
database_name = "zlg_maintenance_db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.production.vars]
ENVIRONMENT = "production"
API_TITLE = "庄骆贵一体化养护管理系统 API"
API_VERSION = "v1"
# 上线后改成 Pages 正式域名，例如 https://zlg-maintenance.pages.dev
ALLOWED_ORIGINS = "https://zlg-maintenance.pages.dev"
DEFAULT_PAGE_SIZE = "20"
MAX_PAGE_SIZE = "200"
